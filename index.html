<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Screensaver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000000; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="dvdCanvas"></canvas>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const speedParam = parseFloat(urlParams.get('speed')) || 3.5;
    const sizeParam = parseInt(urlParams.get('size')) || 220;

    const canvas = document.getElementById('dvdCanvas');
    const ctx = canvas.getContext('2d');

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    let renderWidth = 1920;
    let renderHeight = 1080;

    function getValidDimensions() {
      const w = window.innerWidth || document.documentElement.clientWidth || screen.width;
      const h = window.innerHeight || document.documentElement.clientHeight || screen.height;
      return {
        w: (w && w > 100) ? w : 1920,
        h: (h && h > 100) ? h : 1080
      };
    }

    function resize() {
      const dims = getValidDimensions();
      renderWidth = dims.w;
      renderHeight = dims.h;
      canvas.width = renderWidth;
      canvas.height = renderHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const logo = new Image();
    logo.crossOrigin = "Anonymous";
    logo.src = 'Hope LOGO Transparent.png?' + new Date().getTime();

    let logoWidth = sizeParam;
    let logoHeight = sizeParam * 0.5;

    let x = 100;
    let y = 100;
    let dx = speedParam;
    let dy = speedParam;

    const colors = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FF00', '#0099FF', '#FF9900'];
    let currentColor = colors[0];

    function changeColor() {
      let nextColor = currentColor;
      while (nextColor === currentColor) {
        nextColor = colors[Math.floor(Math.random() * colors.length)];
      }
      currentColor = nextColor;
    }

    function renderTintedLogo() {
      offCanvas.width = logoWidth;
      offCanvas.height = logoHeight;

      offCtx.clearRect(0, 0, logoWidth, logoHeight);
      offCtx.drawImage(logo, 0, 0, logoWidth, logoHeight);

      offCtx.globalCompositeOperation = 'source-atop';
      offCtx.fillStyle = currentColor;
      offCtx.fillRect(0, 0, logoWidth, logoHeight);
      offCtx.globalCompositeOperation = 'source-over';
    }

    let isStarted = false;

    function initLogo() {
      if (isStarted) return;
      
      resize(); // Enforce accurate size before calculation

      if (logo.naturalWidth && logo.naturalHeight) {
        logoHeight = logoWidth * (logo.naturalHeight / logo.naturalWidth);
      } else {
        logoHeight = logoWidth * 0.5;
      }

      // Safe starting coordinates inside active viewport
      x = Math.max(20, (renderWidth - logoWidth) / 2);
      y = Math.max(20, (renderHeight - logoHeight) / 2);

      isStarted = true;
      requestAnimationFrame(animate);
    }

    logo.onload = initLogo;

    setTimeout(() => {
      if (!isStarted) initLogo();
    }, 500);

    function animate() {
      // Re-evaluate bounds every frame in case window initialized late
      const dims = getValidDimensions();
      if (canvas.width !== dims.w || canvas.height !== dims.h) {
        renderWidth = dims.w;
        renderHeight = dims.h;
        canvas.width = renderWidth;
        canvas.height = renderHeight;
      }

      ctx.clearRect(0, 0, renderWidth, renderHeight);

      renderTintedLogo();
      ctx.drawImage(offCanvas, x, y);

      x += dx;
      y += dy;

      let bounced = false;

      // Wall detection using enforced dimensions
      if (x + logoWidth >= renderWidth) {
        x = renderWidth - logoWidth;
        dx = -Math.abs(dx);
        bounced = true;
      } else if (x <= 0) {
        x = 0;
        dx = Math.abs(dx);
        bounced = true;
      }

      if (y + logoHeight >= renderHeight) {
        y = renderHeight - logoHeight;
        dy = -Math.abs(dy);
        bounced = true;
      } else if (y <= 0) {
        y = 0;
        dy = Math.abs(dy);
        bounced = true;
      }

      if (bounced) {
        changeColor();
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
