<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Screensaver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="dvdCanvas"></canvas>
  <script>
    // Read speed/size parameters if provided in URL, otherwise use defaults
    const urlParams = new URLSearchParams(window.location.search);
    const speedParam = parseFloat(urlParams.get('speed')) || 4;
    const sizeParam = parseInt(urlParams.get('size')) || 220;

    const canvas = document.getElementById('dvdCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const logo = new Image();
    // Default logo file hosted in your repository
    logo.src = 'Hope LOGO Transparent.png';

    let logoWidth = sizeParam;
    let logoHeight = sizeParam * 0.5;

    let x = Math.random() * (canvas.width - logoWidth);
    let y = Math.random() * (canvas.height - logoHeight);
    let dx = speedParam;
    let dy = speedParam;

    const colors = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FF00', '#0099FF', '#FF9900'];
    let currentColor = colors[Math.floor(Math.random() * colors.length)];

    function changeColor() {
      currentColor = colors[Math.floor(Math.random() * colors.length)];
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw tinted logo
      ctx.drawImage(logo, x, y, logoWidth, logoHeight);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = currentColor;
      ctx.fillRect(x, y, logoWidth, logoHeight);
      ctx.globalCompositeOperation = 'source-over';

      // Wall bounce checks
      if (x + logoWidth >= canvas.width || x <= 0) { 
        dx = -dx; 
        changeColor(); 
      }
      if (y + logoHeight >= canvas.height || y <= 0) { 
        dy = -dy; 
        changeColor(); 
      }

      x += dx;
      y += dy;

      requestAnimationFrame(animate);
    }

    logo.onload = () => {
      logoHeight = logoWidth * (logo.naturalHeight / logo.naturalWidth);
      animate();
    };
  </script>
</body>
</html>
