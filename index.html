<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Screensaver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#dvdCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="dvdCanvas" width="1920" height="1080"></canvas>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const speedParam = parseFloat(urlParams.get('speed')) || 4;
    const sizeParam = parseInt(urlParams.get('size')) || 240;

    const canvas = document.getElementById('dvdCanvas');
    const ctx = canvas.getContext('2d');

    // Hardcode logical arena to standard 1080p
    const V_WIDTH = 1920;
    const V_HEIGHT = 1080;

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    const logo = new Image();
    logo.crossOrigin = "Anonymous";
    logo.src = 'Hope LOGO Transparent.png?' + new Date().getTime();

    let logoWidth = sizeParam;
    let logoHeight = sizeParam * 0.5;

    // Start in center of 1080p canvas
    let x = (V_WIDTH - logoWidth) / 2;
    let y = (V_HEIGHT - logoHeight) / 2;
    let dx = speedParam;
    let dy = speedParam;

    const colors = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FF00', '#0099FF', '#FF9900'];
    let currentColor = colors[0];

    function changeColor() {
      let nextColor = currentColor;
      while (nextColor === currentColor) {
        nextColor = colors[Math.floor(Math.random() * colors.length)];
      }
      currentColor = nextColor;
    }

    function renderTintedLogo() {
      offCanvas.width = logoWidth;
      offCanvas.height = logoHeight;

      offCtx.clearRect(0, 0, logoWidth, logoHeight);
      offCtx.drawImage(logo, 0, 0, logoWidth, logoHeight);

      offCtx.globalCompositeOperation = 'source-atop';
      offCtx.fillStyle = currentColor;
      offCtx.fillRect(0, 0, logoWidth, logoHeight);
      offCtx.globalCompositeOperation = 'source-over';
    }

    let isStarted = false;

    function initLogo() {
      if (isStarted) return;
      isStarted = true;

      if (logo.naturalWidth && logo.naturalHeight) {
        logoHeight = logoWidth * (logo.naturalHeight / logo.naturalWidth);
      }

      x = Math.random() * (V_WIDTH - logoWidth);
      y = Math.random() * (V_HEIGHT - logoHeight);

      requestAnimationFrame(animate);
    }

    logo.onload = initLogo;

    setTimeout(() => {
      if (!isStarted) initLogo();
    }, 400);

    function animate() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      renderTintedLogo();
      ctx.drawImage(offCanvas, x, y);

      x += dx;
      y += dy;

      let bounced = false;

      // Bounce math using strictly fixed 1920x1080 grid
      if (x + logoWidth >= V_WIDTH) {
        x = V_WIDTH - logoWidth;
        dx = -Math.abs(dx);
        bounced = true;
      } else if (x <= 0) {
        x = 0;
        dx = Math.abs(dx);
        bounced = true;
      }

      if (y + logoHeight >= V_HEIGHT) {
        y = V_HEIGHT - logoHeight;
        dy = -Math.abs(dy);
        bounced = true;
      } else if (y <= 0) {
        y = 0;
        dy = Math.abs(dy);
        bounced = true;
      }

      if (bounced) {
        changeColor();
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
