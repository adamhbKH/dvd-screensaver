<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Screensaver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000000; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="dvdCanvas"></canvas>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const speedParam = parseFloat(urlParams.get('speed')) || 3.5;
    const sizeParam = parseInt(urlParams.get('size')) || 220;

    const canvas = document.getElementById('dvdCanvas');
    const ctx = canvas.getContext('2d');

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth || document.documentElement.clientWidth || 1920;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || 1080;
    }
    window.addEventListener('resize', resize);
    resize();

    const logo = new Image();
    logo.crossOrigin = "Anonymous";
    
    // Add cache-buster to prevent Presenter from serving a stale broken image
    logo.src = 'Hope LOGO Transparent.png?' + new Date().getTime();

    let logoWidth = sizeParam;
    let logoHeight = sizeParam * 0.5;

    let x = 50;
    let y = 50;
    let dx = speedParam;
    let dy = speedParam;

    const colors = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FF00', '#0099FF', '#FF9900'];
    let currentColor = colors[0];

    function changeColor() {
      let nextColor = currentColor;
      while (nextColor === currentColor) {
        nextColor = colors[Math.floor(Math.random() * colors.length)];
      }
      currentColor = nextColor;
    }

    function renderTintedLogo() {
      offCanvas.width = logoWidth;
      offCanvas.height = logoHeight;

      offCtx.clearRect(0, 0, logoWidth, logoHeight);
      offCtx.drawImage(logo, 0, 0, logoWidth, logoHeight);

      offCtx.globalCompositeOperation = 'source-atop';
      offCtx.fillStyle = currentColor;
      offCtx.fillRect(0, 0, logoWidth, logoHeight);
      offCtx.globalCompositeOperation = 'source-over';
    }

    let isStarted = false;

    function initLogo() {
      if (isStarted) return;
      isStarted = true;

      // Safely calculate height ratio with fallback
      if (logo.naturalWidth && logo.naturalHeight) {
        logoHeight = logoWidth * (logo.naturalHeight / logo.naturalWidth);
      } else {
        logoHeight = logoWidth * 0.5; // Standard default fallback
      }

      x = Math.max(10, Math.min(canvas.width - logoWidth - 10, Math.random() * (canvas.width - logoWidth)));
      y = Math.max(10, Math.min(canvas.height - logoHeight - 10, Math.random() * (canvas.height - logoHeight)));

      requestAnimationFrame(animate);
    }

    logo.onload = initLogo;

    // Safety fallback: Force start if Presenter suppresses onload
    setTimeout(() => {
      if (!isStarted) initLogo();
    }, 500);

    function animate() {
      if (canvas.width === 0 || canvas.height === 0) {
        resize();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderTintedLogo();
      ctx.drawImage(offCanvas, x, y);

      x += dx;
      y += dy;

      let bounced = false;

      if (x + logoWidth >= canvas.width) {
        x = canvas.width - logoWidth;
        dx = -Math.abs(dx);
        bounced = true;
      } else if (x <= 0) {
        x = 0;
        dx = Math.abs(dx);
        bounced = true;
      }

      if (y + logoHeight >= canvas.height) {
        y = canvas.height - logoHeight;
        dy = -Math.abs(dy);
        bounced = true;
      } else if (y <= 0) {
        y = 0;
        dy = Math.abs(dy);
        bounced = true;
      }

      if (bounced) {
        changeColor();
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
